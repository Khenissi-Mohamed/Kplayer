<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>K-Player · Connexion TV</title>
<style>
  :root{--bg:#0b0f17;--panel:#121826;--panel-2:#0e1420;--txt:#e8edf6;--muted:#8a93a6;--line:#1e2636;--accent:#3ba1ff;--accent-2:#1f6fd4;--ok:#28c76f;--err:#ff5c6c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(800px 400px at 70% -10%,#17233b 0%,var(--bg) 60%);background-color:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px}
  .card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center}
  .logo::after{content:"";border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #fff;margin-left:3px}
  h1{font-size:24px;margin:0}
  p.sub{color:var(--muted);margin:8px 0 22px;font-size:15px;line-height:1.45}
  label{display:block;font-size:14px;color:var(--muted);margin:0 0 7px}
  input{width:100%;padding:15px 16px;font-size:17px;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;color:var(--txt);outline:none;margin-bottom:16px;font-family:inherit}
  input:focus{border-color:var(--accent)}
  .pw{position:relative}
  .pw button{position:absolute;right:8px;top:8px;height:38px;padding:0 12px;border:0;border-radius:9px;background:rgba(255,255,255,.07);color:var(--muted);font-size:14px}
  .go{width:100%;padding:16px;font-size:18px;font-weight:700;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;margin-top:6px}
  .go:disabled{opacity:.6}
  .msg{margin-top:16px;min-height:22px;font-size:15px;line-height:1.4}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .sec{margin-top:18px;font-size:13px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:14px}
  .done{text-align:center;padding:20px 0}
  .done .big{font-size:56px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo"></div><h1>K-Player</h1></div>
  <div id="form">
    <p class="sub">Saisis les informations de ton serveur Xtream : elles seront envoyées chiffrées à ta TV.</p>
    <label for="h">Serveur (host:port)</label>
    <input id="h" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="http://mon-serveur.tv:8080" />
    <label for="u">Identifiant</label>
    <input id="u" autocapitalize="off" autocomplete="username" spellcheck="false" />
    <label for="p">Mot de passe</label>
    <div class="pw"><input id="p" type="password" autocomplete="current-password" /><button type="button" id="eye">Afficher</button></div>
    <button class="go" id="go">Envoyer à la TV</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="sec">Chiffrement par masque jetable : la clé ne se trouve que dans le QR code (partie après #, jamais envoyée au réseau). Le relais ntfy.sh ne voit que du texte illisible.</div>
</div>
<script>
(function () {
  var NTFY = 'https://ntfy.sh';
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (t, k) { var m = $('msg'); m.textContent = t; m.className = 'msg ' + (k || ''); };
  var q = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = kv.slice(i + 1); });
  function unb64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
  function b64url(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  var key = null;
  try { if (q.t && /^[\w-]{8,64}$/.test(q.t) && q.k) key = unb64url(q.k); } catch (e) {}
  if (!key) { $('go').disabled = true; msg('Lien invalide : scanne à nouveau le QR code affiché sur la TV.', 'err'); return; }
  history.replaceState(null, '', location.pathname + '#t=' + q.t + '&k=' + q.k);
  $('eye').onclick = function () { var p = $('p'); p.type = p.type === 'password' ? 'text' : 'password'; this.textContent = p.type === 'password' ? 'Afficher' : 'Masquer'; };
  $('go').onclick = function () {
    var h = $('h').value.trim(), u = $('u').value.trim(), p = $('p').value;
    if (!h || !u || !p) { msg('Remplis les trois champs.', 'err'); return; }
    if (!/^https?:\/\//i.test(h)) h = 'http://' + h;
    var bin = unescape(encodeURIComponent('KP1:' + JSON.stringify({ h: h, u: u, p: p })));
    if (bin.length > key.length) { msg('Informations trop longues.', 'err'); return; }
    var c = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) c[i] = bin.charCodeAt(i) ^ key[i];
    $('go').disabled = true; msg('Envoi…');
    fetch(NTFY + '/' + q.t, { method: 'POST', body: b64url(c) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
      .then(function () {
        key = null;
        $('form').innerHTML = '<div class="done"><div class="big">✓</div><p class="sub">Envoyé ! Regarde ta TV : elle se connecte.<br>Tu peux fermer cette page.</p></div>';
      })
      .catch(function (e) { $('go').disabled = false; msg('Échec de l’envoi (' + e.message + '). Réessaie.', 'err'); });
  };
})();
</script>
</body>
</html>
